# yaml-language-server: $schema=https://raw.githubusercontent.com/karoterra/aviutl2-aulua/refs/heads/main/schema/aulua.schema.json
project:
  variables:
    NAME: Basic_S
    AUTHOR: σ軸
    LEAST_AVIUTL_VERSION: "2005400"
    LEAST_AVIUTL_VERSION_STRING: "2.0.54"

package:
  id: Basic_S
  name: 汎用スクリプト集 Basic_S
  version: v2.71
  information: "{name} {version} by {AUTHOR}"
  script_sub_dir: ""
  uninstall_sub_folder_file: false
  message:
    text: |
      # Basic_S AviUtl ExEdit2 汎用スクリプト集

      汎用的な基本効果や基本図形などをまとめた AviUtl ExEdit2 用のスクリプト集です．丸角四角形の生成や斜め軸での回転，回転中心のマウス操作移動や傾斜変形，内側シャドウや内側縁取りなどができます．

      公開ページ:
      https://github.com/sigma-axis/aviutl2_script_Basic_S

      紹介動画:
      https://www.nicovideo.jp/watch/sm45523651

      お願い:
      ニコニコ動画での親作品登録をしていただけると励みになります．
      作品 ID: sm45523651

  assets:
    - src: README.md
      dest: Script/{id}/README.md
    - src: LICENSE
      dest: Script/{id}/LICENSE
    - src: Tooltip.aul2
      dest: Language/Default.{id}.aul2
  file_name: package.au2pkg.zip

build:
  out_dir: build

scripts:
  - name: Basic_S.lua
    sources:
      - path: script/preamble.lua
      - path: script/Basic_S.lua

  - name: "@Basic_S.anm2"
    sources:
      - path: script/preamble.lua
      - label: 四隅丸め
        path: script/effect/四隅丸め/main.lua
